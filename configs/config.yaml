# ============================================================
# MLPiezoV2 generic repo-local configuration
# Prefer per-model configs generated by bootstrap_single_model.py
# for real work. This YAML is a neutral starter only.
# ============================================================

geostudio:
  geocmd_location: "C:/Program Files/Seequent/GeoStudio 2024.1/Bin"
  
  template_shallow: "models/templates/shallow.xml"
  template_deep: "models/templates/deep.xml"
  
  working_dir: "models/working"
  
  csv_output_shallow: "models/working/Analysis/001/slip_surface.csv"
  csv_output_deep: "models/working/Analysis/001/slip_surface.csv"
  
  fos_column_name: "SlipFOS"
  
  retries: 6
  backoff_seconds: 1.0
  timeout_seconds: null
  file_timeout_seconds: 180

phreatic:
  control_points:
    points:
      - number: 1
        x: 0.0
        y_min: 1555.0
        y_max: 1575.0
        y_baseline: 1571.0
        name: "Upstream pond"
      
      - number: 2
        x: 1000.2
        y_min: 1540.0
        y_max: 1560.0
        y_baseline: 1561.9
        name: "Mid-embankment"
      
      - number: 3
        x: 1280.4911
        y_min: 1475.0
        y_max: 1490.0
        y_baseline: 1491.9171
        name: "Downstream"
      
      - number: 4
        x: 1400.0
        y_min: 1475.0
        y_max: 1489.0
        y_baseline: 1491.1087
        name: "Far downstream"
  
  interpolation:
    n_total_points: 50
    method: "pchip"
    x_min: 0.0
    x_max: 1400.0
  
  constraints:
    enforce_flow_direction: true
    allow_local_reversals: false
    max_gradient: 0.5
    enforce_below_ground: true
    ground_clearance_m: 2.0

ground_profile:
  x_coords: [0, 500, 994.1295, 1100, 1186.74, 1280.4911, 1350, 1400]
  y_coords: [1571, 1567, 1562, 1553, 1544, 1491.92, 1491.5, 1491.11]

dataset:
  n_samples: 100
  sampling_method: "sobol"
  output_dir: "data/datasets/default"
  version: "v2"
  description: "MLPiezoV2 starter configuration"
  checkpoint_frequency: 10
  random_seed: 42

error_handling:
  on_physics_error: "record_and_continue"
  on_convergence_error: "record_and_continue"
  on_xml_error: "abort"
  max_consecutive_failures: 10
  record_failures: true

logging:
  log_dir: "logs"
  level: "INFO"
  print_progress: true
  print_each_sample: true
  print_timing: true

system:
  precision: 0.01
  rounding_decimals: 2
